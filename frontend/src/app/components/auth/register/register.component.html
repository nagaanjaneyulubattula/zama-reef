<div class="auth-page">
  <div class="auth-card">
    <div class="auth-icon">🐙</div>
    <h1>Join the reef</h1>
    <p>Create your diver account and escape public chains.</p>

    <form (ngSubmit)="onSubmit()">
      <label>
        <span>🪪 Diver name</span>
        <input type="text" [(ngModel)]="displayName" name="displayName" required maxlength="24" placeholder="Captain Ink" />
      </label>

      <label>
        <span>📧 Email</span>
        <input type="email" [(ngModel)]="email" name="email" required autocomplete="email" placeholder="you@example.com" />
      </label>

      <label>
        <span>🔑 Password</span>
        <input type="password" [(ngModel)]="password" name="password" required minlength="6" autocomplete="new-password" placeholder="Min. 6 characters" />
      </label>

      <label>
        <span>🔁 Confirm password</span>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required autocomplete="new-password" placeholder="Repeat password" />
      </label>

      @if (error()) {
        <div class="error">{{ error() }}</div>
      }

      @if (success()) {
        <div class="success">Account created! Check your email if confirmation is enabled, then sign in.</div>
      }

      <button class="btn btn-primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating...' : '✨ Register' }}
      </button>
    </form>

    <p class="switch">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>
    <a class="back" routerLink="/">← Back to home</a>
  </div>
</div>
